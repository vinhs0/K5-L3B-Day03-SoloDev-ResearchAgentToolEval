# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng và dừng chờ trả lời. DÙNG KHI: (1) thiếu thông tin bắt buộc (thiếu tài khoản, URL, chủ đề) -> response_type=text; (2) sắp gửi/đăng ra ngoài (send, Telegram) mà người dùng chưa xác nhận -> response_type=yes_no; (3) cần chọn giữa vài phương án -> choice. KHÔNG DÙNG khi yêu cầu đã đủ rõ để tìm kiếm/đọc."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "yes_no = BẤT KỲ yêu cầu gửi/đăng/publish/send nào (vd Telegram), kể cả khi nội dung còn mơ hồ ('bản tin này') - luôn xin xác nhận có/không trước; text = chỉ khi thiếu thông tin KHÔNG phải hành động gửi (thiếu handle, URL, chủ đề); choice = chọn một trong options."}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây của MỘT tài khoản mạng xã hội cụ thể mà người dùng đã nêu (theo tên/handle). KHÔNG DÙNG để tìm bài theo chủ đề (dùng social_search) hay tra tin tức web (dùng lookup). Chưa biết tài khoản nào thì dùng clarify."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle, KHÔNG có @, viết thường đúng handle thật (Sam Altman -> sama, Elon Musk -> elonmusk, Andrej Karpathy -> karpathy)."}
        limit: {type: integer, default: 5, description: "Số bài đăng; dùng đúng số người dùng nêu ('10 tweet' -> 10), không nêu thì 5."}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng Twitter/X theo TỪ KHÓA/chủ đề để xem mọi người đang nói gì. DÙNG KHI người dùng nhắc rõ mạng xã hội/Twitter/X/dư luận. KHÔNG DÙNG khi người dùng muốn tin tức/bài báo hoặc đã bảo bỏ mạng xã hội (dùng lookup); không dùng cho bài của một tài khoản cụ thể (dùng timeline)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chỉ từ khóa chủ đề (vd 'GPT-5', 'OpenAI'); bỏ các từ như tweet, Twitter, mới nhất, phổ biến."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Top khi người dùng nói phổ biến/top/nổi bật/hot; Latest khi nói mới nhất/gần đây hoặc không nêu."}
        limit: {type: integer, default: 5, description: "Số bài đăng; dùng đúng số người dùng nêu, không nêu thì 5."}
      required: [query]

  - name: lookup
    description: "Tìm kiếm trên web: tin tức, bài báo, thông tin chung. DÙNG KHI người dùng hỏi tin tức/sự kiện/thông tin, hoặc nói muốn tìm trên web (kể cả khi chuyển từ mạng xã hội sang web). KHÔNG DÙNG để xem bài đăng mạng xã hội (social_search/timeline) hay đọc một URL cụ thể (fetch)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chỉ từ khóa chủ đề cốt lõi (vd 'AI', 'robotics'). BỎ các từ tin tức/news/mới nhất/hôm nay/tuần này vì đã có topic và timeframe. Giữ chủ đề của lượt hiện tại."}
        topic: {type: string, enum: [general, news], default: "general", description: "'news' bất cứ khi nào người dùng hỏi tin tức/tin/sự kiện mới (kể cả 'tin công nghệ'); còn lại 'general'."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "hôm nay -> day; tuần này/gần đây -> week; tháng này -> month; năm nay -> year. Giữ timeframe đã nêu ở lượt trước nếu người dùng nói 'vẫn là'. Không nêu thì week."}
        max_results: {type: integer, default: 5, description: "Số kết quả; dùng đúng số người dùng nêu, không nêu thì 5."}
      required: [query]

  - name: fetch
    description: "Đọc nội dung đầy đủ của một trang web có URL mà NGƯỜI DÙNG đã cung cấp. KHÔNG DÙNG để tìm kiếm (dùng lookup), không tự bịa URL; chưa có URL thì dùng clarify."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL đầy đủ do người dùng cung cấp."}
      required: [url]

  - name: format
    description: "Trình bày các item ĐÃ thu thập (từ lookup, social_search, timeline, fetch) thành văn bản theo khuôn. Chỉ gọi sau khi đã có dữ liệu. KHÔNG DÙNG để tìm dữ liệu mới và không tự gửi văn bản đi (gửi là việc của send)."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi/đăng văn bản ra ngoài (ví dụ Telegram) - hành động ghi, không hoàn tác. KHÔNG gọi send nếu người dùng chưa xác nhận rõ nội dung; khi mới có yêu cầu gửi, gọi clarify yes_no trước. Chỉ khi người dùng đã đồng ý mới gọi send với confirmed=true."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Đúng nội dung đã được người dùng xác nhận sẽ gửi."}
        confirmed: {type: boolean, default: false, description: "Chỉ true khi người dùng đã xác nhận rõ ràng gửi đúng text này; mặc định false. Chưa xác nhận thì không gọi send, hãy gọi clarify yes_no."}
      required: [text]

  - name: policy
    description: "Tra cứu chính sách/quy định nội bộ (nguồn trích dẫn, quyền riêng tư, đăng bài ra ngoài, cách dùng tool). KHÔNG DÙNG để tìm tin tức hay thông tin web (lookup)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm paper khoa học (arXiv) theo từ khóa. DÙNG KHI hỏi về nghiên cứu/học thuật. KHÔNG DÙNG cho tin tức thường (lookup) hay đọc nội dung paper đã biết (paper_text)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của MỘT paper arXiv đã biết ID/URL (thường sau papers). KHÔNG DÙNG để tìm paper theo từ khóa (papers) hay đọc trang web thường (fetch)."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Team tools ----------------
  - name: wikipedia
    description: "Lấy bản tóm tắt bách khoa của MỘT bài Wikipedia theo tiêu đề. DÙNG KHI người dùng hỏi định nghĩa/khái niệm/tiểu sử nền tảng ('X là gì', 'who is Y'). KHÔNG DÙNG cho tin tức hay sự kiện mới (dùng lookup), và không dùng để đọc một URL người dùng đưa (dùng fetch)."
    parameters:
      type: object
      properties:
        title: {type: string, default: "", description: "Tiêu đề bài Wikipedia, chỉ khái niệm cốt lõi (vd 'Transformer (machine learning model)', 'Alan Turing')."}
        lang: {type: string, enum: [en, vi, fr, de, es, ja, zh], default: "en", description: "Ngôn ngữ Wikipedia; 'vi' khi người dùng muốn tiếng Việt, còn lại 'en'."}
      required: [title]

  - name: hackernews
    description: "Tìm bài (story) trên Hacker News theo từ khóa. CHỈ DÙNG KHI người dùng nhắc rõ Hacker News/HN. KHÔNG DÙNG cho tin tức chung (dùng lookup) hay bài đăng Twitter/X (dùng social_search)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chỉ từ khóa chủ đề (vd 'LLM', 'Rust'); bỏ các từ Hacker News, HN, mới nhất."}
        sort: {type: string, enum: [relevance, date], default: "relevance", description: "date khi người dùng nói mới nhất/gần đây; relevance khi nói hay nhất/liên quan hoặc không nêu."}
        limit: {type: integer, default: 5, description: "Số bài (1-20); dùng đúng số người dùng nêu, không nêu thì 5."}
      required: [query]

  - name: current_time
    description: "Cho biết ngày/giờ/thứ hiện tại theo múi giờ. CHỈ DÙNG KHI người dùng hỏi bây giờ là mấy giờ/hôm nay là ngày nào/thứ mấy. KHÔNG DÙNG để tìm tin tức 'hôm nay' (dùng lookup với timeframe=day)."
    parameters:
      type: object
      properties:
        timezone: {type: string, default: "Asia/Ho_Chi_Minh", description: "Tên múi giờ IANA (vd Asia/Ho_Chi_Minh, UTC, America/New_York, Asia/Tokyo). Không nêu thì Asia/Ho_Chi_Minh."}
      required: []
